trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

stages:

# =========================
# CI
# =========================
- stage: Build
  displayName: 'Build React Application'

  jobs:
  - job: BuildReact
    displayName: 'Build'

    steps:

    - checkout: self

    - task: UseNode@1
      inputs:
        version: '20.x'
      displayName: 'Install Node.js'

    - script: |
        node --version
        npm --version
      displayName: 'Check Node and npm'

    - script: |
        npm ci
      displayName: 'Install Dependencies'

    - script: |
        npm run build
      displayName: 'Build React Application'

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/build'
        artifact: 'website'
        publishLocation: 'pipeline'
      displayName: 'Publish Website Artifact'


# =========================
# CD
# =========================
- stage: Deploy
  displayName: 'Deploy to Azure VM'

  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: DeployWebsite
    displayName: 'Deploy Website to VM'

    steps:

    - task: DownloadPipelineArtifact@2
      inputs:
        artifact: 'website'
        path: '$(Pipeline.Workspace)/website'
      displayName: 'Download Website Artifact'

    - task: CopyFilesOverSSH@0
      inputs:
        sshEndpoint: 'azure-vm-ssh'
        sourceFolder: '$(Pipeline.Workspace)/website'
        contents: '**'
        targetFolder: '/var/www/mywebsite'
        cleanTargetFolder: true
        overwrite: true
      displayName: 'Copy Website to Azure VM'

    - task: SSH@0
      inputs:
        sshEndpoint: 'azure-vm-ssh'
        runOptions: 'commands'
        commands: |
          sudo nginx -t
          sudo systemctl reload nginx
          echo "Website deployment completed"
      displayName: 'Reload Nginx'